# Alertmanager → LLM-ассистент: вебхук для разбора критичных алертов.
# Фрагмент дополняет основной config Alertmanager (route/receivers).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-extra
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yaml: |
    route:
      receiver: default
      group_by: ['alertname', 'service', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Критичные/пейджинговые алерты дополнительно уходят в LLM-разбор
        - matchers:
            - severity =~ "critical|page"
          receiver: llm-assistant
          group_wait: 15s
          continue: true
        - matchers:
            - severity = warning
          receiver: llm-assistant
          group_wait: 1m
          continue: true
    receivers:
      - name: default
        # ... ваши существующие получатели (slack/pagerduty)
      - name: llm-assistant
        webhook_configs:
          - url: http://llm-assistant.observability.svc:8080/webhook/alertmanager
            send_resolved: true
            max_alerts: 20
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'service']
