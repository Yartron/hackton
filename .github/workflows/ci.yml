name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -r llm-assistant/requirements.txt
      - name: Pytest
        working-directory: llm-assistant
        run: python -m pytest -v
      - name: Сборка образа
        run: docker build -t llm-assistant:ci llm-assistant
