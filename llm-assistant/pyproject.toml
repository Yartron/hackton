[project]
name = "llm-assistant"
version = "0.1.0"
description = "LLM-ассистент SRE-платформы наблюдаемости: анализ логов/метрик, генерация алертов, предложения по инцидентам"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.6,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
